name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install 'torch>=2.1,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'

      - name: Check Ruff lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check src tests scripts

      - name: Run tests without model weights
        env:
          HF_HUB_OFFLINE: '1'
        run: python -m pytest -m 'not argos_integration and not marian_integration'
