[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-translation-service"
version = "0.1.0"
description = "Local pluggable machine translation HTTP service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.6,<5",
    "argostranslate>=1.11,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "scalar-fastapi>=1.8,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pyyaml>=6,<7",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/translation_service"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "argos_integration: requires a locally installed Argos translation model",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
